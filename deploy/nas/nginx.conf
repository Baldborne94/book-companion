# L'app e le cartelle dei libri dallo stesso indirizzo (https://book-companion.<rete>.ts.net):
# l'HTTPS lo termina Tailscale, qui dentro basta HTTP.

# Finché l'app su Vercel resta in uso, anche lei può leggere le cartelle (come in docs/NAS.md).
map $http_origin $app {
  default "";
  "https://book-companion-ruddy.vercel.app" $http_origin;
}

server {
  listen 8080;
  charset utf-8;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # sw.js e index.html mai in cache HTTP: il banner «nuova versione» deve poter arrivare
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.json { add_header Cache-Control "no-cache"; }
  location = /config.js { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Le cartelle dei libri, in sola lettura, nel formato che legge lib/nas.js.
  location /libri/ {
    alias /libri/;
    autoindex on;
    autoindex_format json;

    add_header Access-Control-Allow-Origin $app always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Headers "Range, Accept" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    add_header Access-Control-Allow-Private-Network "true" always;

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $app always;
      add_header Access-Control-Allow-Headers "Range, Accept" always;
      add_header Access-Control-Allow-Private-Network "true" always;
      return 204;
    }
  }

  # Supabase del NAS, dalla stessa origine dell'app. Gli indirizzi si
  # risolvono a richiesta (resolver di Docker): nginx parte anche se Supabase
  # non e' ancora su, e dice 502 finche' non arriva.
  resolver 127.0.0.11 valid=30s ipv6=off;
  client_max_body_size 100m;
  # PostgREST ripete l'indirizzo della richiesta in Content-Location, e la
  # sincronizzazione chiede le schede cento alla volta con gli id
  # nell'indirizzo: ~4 KB di intestazione, oltre il buffer di serie di nginx
  # («upstream sent too big header», 502 sul tablet). Anche le richieste lunghe
  # in entrata hanno il loro spazio.
  proxy_buffer_size 64k;
  proxy_buffers 8 64k;
  proxy_busy_buffers_size 128k;
  large_client_header_buffers 8 64k;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_http_version 1.1;

  location /auth/v1/ {
    set $auth http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $auth;
  }

  location /rest/v1/ {
    set $rest http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest;
  }

  location /storage/v1/ {
    set $storage http://storage:5000;
    rewrite ^/storage/v1/(.*)$ /$1 break;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
    proxy_pass $storage;
  }

  location / {
    try_files $uri $uri.html /index.html;
  }
}
