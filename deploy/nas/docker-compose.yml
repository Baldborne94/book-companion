# Book Companion sul NAS: Caddy serve l'app + la cartella Biblioteca,
# Tailscale le espone in HTTPS su https://<TS_HOSTNAME>.<tailnet>.ts.net
name: book-companion

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-book-companion}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: deploy/nas/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    network_mode: service:tailscale
    volumes:
      - ${BIBLIOTECA_PATH}:/srv/biblioteca:ro
    depends_on:
      - tailscale
    restart: unless-stopped
