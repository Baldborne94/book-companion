# Book Companion ospitata sul NAS: nginx serve l'app e le cartelle dei libri,
# Tailscale le pubblica in HTTPS su https://<TS_HOSTNAME>.<rete>.ts.net
name: book-companion

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-book-companion}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: deploy/nas/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    network_mode: service:tailscale
    volumes:
      # la cartella condivisa diventa /libri/book-companion/{Libri,Fumetti,Manga}, come vuole lib/nas.js
      - ${BIBLIOTECA_PATH}:/libri/book-companion:ro
    depends_on:
      - tailscale
    restart: unless-stopped
