# I TEST LI LANCIA LA MACCHINA, NON LA MEMORIA DI CHI COMMITTA.
#
# I controlli automatici erano 1299 e non li eseguiva nessuno su GitHub:
# l'unico segnale sui PR era il deploy di Vercel, che diventa verde anche
# con la suite rossa. Finora la garanzia era la disciplina di chi scriveva
# — «npm run build e npm test sempre verdi prima di ogni commit», sta
# scritto in CLAUDE.md — cioè una garanzia che dipende da una persona.
#
# IL BROWSER SI INSTALLA APPOSTA. `test/tema.test.mjs` ha bisogno di un
# browser vero (il CSS non si prova a mente) e senza si dichiara SALTATO.
# Saltare non è passare: in una macchina che parte pulita ogni volta,
# senza questo passo la guardia di `readerTheme.js` non girerebbe MAI —
# e il file che difende è quello che tiene l'inchiostro leggibile sul
# tema notte.
name: Prova

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prova:
    runs-on: ubuntu-latest
    # di solito bastano tre minuti; senza tetto una prova appesa tiene la
    # macchina accesa per sei ore
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` e non `install`: si installa quello che dice il lockfile,
      # senza aggiornare niente per conto suo
      - run: npm ci

      # playwright non sta fra le dipendenze del progetto apposta (chi
      # clona non deve tirarsi dietro un browser per far girare i test di
      # tutti i giorni): qui lo si aggiunge solo alla macchina della prova
      - name: Il browser per la guardia del tema
        run: |
          # UN PLAYWRIGHT PUBBLICATO A META' NON FERMA IL GIRO: il 5/11/2026
          # `playwright@1.65.0` c'era e il suo `playwright-core@1.65.0` no
          # (l'ultimo era 1.64.1), per piu' di un quarto d'ora. Se l'ultimo
          # non si installa si prende la versione di `playwright-core` che
          # esiste davvero: `playwright@X` dipende da `playwright-core@X`.
          npm i -D --no-save playwright || npm i -D --no-save "playwright@$(npm view playwright-core version)"

      # I PACCHETTI DI UBUNTU POSSONO MANCARE PER ORE: l'11/11/2026 la rete
      # della macchina non risolveva `security.ubuntu.com` né
      # `archive.ubuntu.com`, e `--with-deps` cadeva sui caratteri
      # (fonts-ipafont, fonts-wqy-zenhei…) prima di ogni prova, quattro giri
      # di fila. Si riprova tre volte; se Ubuntu non risponde, il browser si
      # installa da solo (scende dal CDN di Playwright, non da Ubuntu) e le
      # prove girano con le librerie che la macchina ha già. Il giro lo dice
      # nel riassunto, così un verde «senza i caratteri di Ubuntu» non si
      # scambia per un giro pieno.
      - name: Le librerie del browser (Ubuntu), o il browser da solo
        run: |
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "Le librerie di Ubuntu non sono scese (giro $i di 3)"
            sleep 30
          done
          npx playwright install chromium
          echo "⚠ Prove senza le librerie di Ubuntu: i pacchetti non si scaricavano, il browser è quello di Playwright da solo" >> "$GITHUB_STEP_SUMMARY"

      - run: npm test

      - run: npm run build

      # LE PROVE SULL'APP INTERA (`e2e/run.mjs`): l'app costruita, puntata
      # su un Supabase finto, in un browser vero — la saga fra due
      # dispositivi, un ePub che si apre, l'Ingresso. Con `CI` accesa una
      # scena saltata e' una scena caduta.
      - run: npm run e2e
