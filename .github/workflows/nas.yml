# LE IMMAGINI DEL NAS SI COSTRUISCONO QUI.
#
# A ogni cambio su main che tocca l'app o il NAS, GitHub costruisce le due
# immagini (l'app con nginx, il database con gli script di Supabase) e le
# pubblica su GHCR. Sul NAS l'aggiornatore (deploy/nas/docker-compose.yml)
# le scarica entro un'ora e riavvia quel che e' cambiato: niente piu' ZIP né
# SSH. Le immagini non portano chiavi: l'app legge Supabase all'avvio dal
# .env del NAS (deploy/nas/config.sh), quindi possono essere pubbliche.
# Nei PR si costruiscono senza pubblicarle: prova che i Dockerfile reggono.
name: NAS

on:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.js
      - scripts/privacy.mjs
      - PRIVACY.md
      - supabase/schema.sql
      - deploy/nas/**
      - .github/workflows/nas.yml
  pull_request:
    paths:
      - deploy/nas/**
      - supabase/schema.sql
      - .github/workflows/nas.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immagine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nome: app
            file: deploy/nas/Dockerfile
          - nome: db
            file: deploy/nas/supabase/Dockerfile
    env:
      PUBBLICA: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      # i nomi delle immagini vogliono le minuscole: Baldborne94 → baldborne94
      - name: Nome dell'immagine
        run: echo "IMMAGINE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/book-companion-${{ matrix.nome }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBBLICA == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ env.PUBBLICA == 'true' }}
          tags: |
            ${{ env.IMMAGINE }}:latest
            ${{ env.IMMAGINE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Book Companion sul NAS (${{ matrix.nome }})
