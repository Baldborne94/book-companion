<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2450"/>
      <stop offset="1" stop-color="#181233"/>
    </linearGradient>
    <radialGradient id="alone" cx="50%" cy="50%" r="52%">
      <stop offset="0" stop-color="#d9a94e" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#9b7fd4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#9b7fd4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copertina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2d5c"/>
      <stop offset="1" stop-color="#241a3a"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d489"/>
      <stop offset="1" stop-color="#c08f35"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#fondo)"/>
  <circle cx="256" cy="256" r="230" fill="url(#alone)"/>

  <!-- la copertina, centrata: margini uguali a sinistra e a destra (132),
       sopra e sotto (94) -->
  <rect x="132" y="94" width="248" height="324" rx="16" fill="url(#copertina)"
        stroke="url(#oro)" stroke-width="12"/>
  <rect x="160" y="122" width="192" height="268" rx="9" fill="none"
        stroke="url(#oro)" stroke-width="5" opacity="0.6"/>

  <!-- fermagli, uno per lato -->
  <path d="M126 236 h-14 a10 10 0 0 0 -10 10 v20 a10 10 0 0 0 10 10 h14 z" fill="url(#oro)"/>
  <path d="M386 236 h14 a10 10 0 0 1 10 10 v20 a10 10 0 0 1 -10 10 h-14 z" fill="url(#oro)"/>

  <!-- borchie agli angoli -->
  <g fill="url(#oro)" opacity="0.9">
    <circle cx="174" cy="136" r="9"/><circle cx="338" cy="136" r="9"/>
    <circle cx="174" cy="376" r="9"/><circle cx="338" cy="376" r="9"/>
  </g>

  <!-- il sigillo, al centro esatto -->
  <g transform="translate(256 256)">
    <circle r="62" fill="none" stroke="url(#oro)" stroke-width="6" opacity="0.8"/>
    <path d="M0 -80 L14 -23 L72 -40 L30 0 L72 40 L14 23 L0 80 L-14 23 L-72 40 L-30 0 L-72 -40 L-14 -23 Z"
          fill="url(#oro)"/>
    <circle r="15" fill="#241a3a"/>
  </g>
</svg>
