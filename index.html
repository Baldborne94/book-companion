<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d1a" />
    <meta name="description" content="La tua biblioteca personale: libri, lettura e musica in un unico regno." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Book Companion</title>
    <!-- Il colore di fondo del tema scelto, PRIMA che il bundle parta. Il
         foglio di stile dipinge il body appena arriva, e il tema vero si
         applicava solo quando React partiva: chi legge col Rifugio Silvano
         vedeva un lampo di notte viola a ogni avvio a freddo. Qui non c'è
         nessuna palette duplicata — solo l'ultimo colore già applicato. -->
    <script>
      try {
        var bg = localStorage.getItem("bc_bg");
        if (bg) {
          document.documentElement.style.setProperty("--bc-bg", bg);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", bg);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
